<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#000"/>

  <!-- subtle lane tints -->
  <rect x="0"   y="0" width="300" height="630" fill="#f7c94808"/>
  <rect x="300" y="0" width="300" height="630" fill="#39b54a08"/>
  <rect x="600" y="0" width="300" height="630" fill="#00e5ff08"/>
  <rect x="900" y="0" width="300" height="630" fill="#e91e6308"/>

  <!-- dashed lane dividers -->
  <line x1="300" y1="0" x2="300" y2="630" stroke="#f7c94833" stroke-width="1" stroke-dasharray="8,10"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#39b54a33" stroke-width="1" stroke-dasharray="8,10"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#00e5ff33" stroke-width="1" stroke-dasharray="8,10"/>

  <!-- falling beans (simple pixel-art ovals) -->
  <!-- yellow bean -->
  <ellipse cx="150" cy="180" rx="38" ry="52" fill="#f7c948"/>
  <ellipse cx="150" cy="180" rx="38" ry="52" fill="none" stroke="#c9a020" stroke-width="3"/>
  <ellipse cx="136" cy="162" rx="10" ry="14" fill="#fff" opacity="0.4"/>

  <!-- green bean -->
  <ellipse cx="450" cy="320" rx="38" ry="52" fill="#39b54a"/>
  <ellipse cx="450" cy="320" rx="38" ry="52" fill="none" stroke="#1e7a2a" stroke-width="3"/>
  <ellipse cx="436" cy="302" rx="10" ry="14" fill="#fff" opacity="0.4"/>

  <!-- cyan bean -->
  <ellipse cx="750" cy="140" rx="38" ry="52" fill="#00e5ff"/>
  <ellipse cx="750" cy="140" rx="38" ry="52" fill="none" stroke="#009ab5" stroke-width="3"/>
  <ellipse cx="736" cy="122" rx="10" ry="14" fill="#fff" opacity="0.4"/>

  <!-- pink bean -->
  <ellipse cx="1050" cy="260" rx="38" ry="52" fill="#e91e63"/>
  <ellipse cx="1050" cy="260" rx="38" ry="52" fill="none" stroke="#a0104a" stroke-width="3"/>
  <ellipse cx="1036" cy="242" rx="10" ry="14" fill="#fff" opacity="0.4"/>

  <!-- hit rings at bottom -->
  <circle cx="150"  cy="560" r="32" fill="none" stroke="#f7c948" stroke-width="3"/>
  <circle cx="450"  cy="560" r="32" fill="none" stroke="#39b54a" stroke-width="3"/>
  <circle cx="750"  cy="560" r="32" fill="none" stroke="#00e5ff" stroke-width="3"/>
  <circle cx="1050" cy="560" r="32" fill="none" stroke="#e91e63" stroke-width="3"/>

  <!-- title -->
  <text x="600" y="390" font-family="monospace" font-size="96" font-weight="bold"
        fill="#f7c948" text-anchor="middle" letter-spacing="6">BOBBY'S BEANS</text>

  <!-- tagline -->
  <text x="600" y="450" font-family="monospace" font-size="28"
        fill="#555" text-anchor="middle" letter-spacing="8">SMUSH OR GET SMUSHED</text>
</svg>
